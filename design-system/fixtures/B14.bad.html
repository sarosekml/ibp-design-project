<!DOCTYPE html>
<!-- ФИКСТУРА линтера: B14. Получена из `_base.ok.html` добавлением ряда
     второго уровня (`.subtabs`) — вместе с парным `sub-tab.css`, иначе
     сработало бы постороннее правило ряда F («класс без своего CSS»), и пара
     проверяла бы не то правило.
     ДЕФЕКТ: ряд второго уровня стоит один, ряда первого уровня
     (`.tabs--horiz` с `.tab`) на странице нет. Разметка при этом валидна и
     выглядит нормально — врёт только иерархия: экран читается как один
     уровень навигации с необычным видом.

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фикстура R — Дизайн-система</title>
<link rel="stylesheet" href="../foundations/Typography/Typography.css">
<link rel="stylesheet" href="../foundations/Colors/Colors.css">

<main class="page ds-split">

    <div class="splitpane__a">

    <div class="splitpane__b">

        <button type="button" class="subtab" role="tab" aria-selected="false" tabindex="-1"><span class="subtab__label">Условия</span></button>
        <button type="button" class="subtab" role="tab" aria-selected="false" tabindex="-1"><span class="subtab__label">Документы</span></button>

  </div>
