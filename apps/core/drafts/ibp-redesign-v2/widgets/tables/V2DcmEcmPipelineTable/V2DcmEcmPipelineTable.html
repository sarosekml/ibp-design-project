<!-- Локальный компонент «Pipeline DCM и ECM клиента» — таблица вкладки «Сделки»
     страницы клиента (ClientInfoPage). Пара во фронтенде — V2DcmEcmPipelineTable.
     Таблицу рисует общий рендер data/registry-table.js в компактном режиме.
     Страница вшивает меткой <ds-include> и монтирует:
     LcDcmEcmPipelineTable.mount(host, { client, kind, title }). -->
<section class="tile tile--headless lc-dcm-ecm-table" data-state="data" data-mode="view">
  <div class="alert alert--error alert--m lc-dcm-ecm-table__error" role="alert">
    <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
    <div class="alert__body"><p class="alert__text">Не удалось загрузить данные</p>
      <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
  </div>
  <div class="dtable">
    <div class="dtable__toolbar"><div class="dtable__toolbar-left"></div><div class="dtable__toolbar-right"></div></div>
    <div class="dtable__body">
      <div class="tbl" data-table data-sort-rows data-rt-tbl><div class="tbl__row tbl__row--head" style="grid-template-columns:8px minmax(8px,1fr)"><div class="th th--separator"></div><div class="th th--separator"></div></div></div>
      <div class="dtable__empty" data-rt-empty hidden><p class="dtable__empty-title" data-rt-empty-title>Нет данных</p></div>
    </div>
    <div class="dtable__footer" data-rt-footer></div>
  </div>
</section>
