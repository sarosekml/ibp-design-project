<!-- Локальный компонент «Сроки» — тайл страницы сделки (Opportunity). Пара во
     фронтенде — V2TimingTile (pretrade/opportunities-app); у лида похожий
     TimingsTile (offersources-app). Страница вшивает меткой <ds-include> и
     заполняет: LcTimingTile.render(host, { opportunity }). -->
<section class="tile lc-timing" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Сроки</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="ibtn ibtn--neutral ibtn--m" aria-label="Редактировать" data-tm-edit><i data-icon="edit"></i></button>
    </div>
  </header>
  <div class="tile__body">
    <div class="alert alert--error alert--m lc-timing__error" role="alert">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Не удалось загрузить данные</p>
        <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
    </div>
    <div class="sk-group lc-timing__loading" aria-busy="true"><span class="sk-line"></span><span class="sk-line"></span><span class="sk-line"></span></div>
    <div class="lc-timing__content">
      <div class="tile__rows">
        <div class="rof"><span class="ds-label"><span class="ds-label__text">Дата начала работы</span></span><div class="rof__row"><span class="rof__value" data-tm-start>05.10.2026</span></div></div>
        <div class="rof"><span class="ds-label"><span class="ds-label__text">Планируемая дата КПКИ</span></span><div class="rof__row"><span class="rof__value" data-tm-kpki>10.12.2026</span></div></div>
        <div class="rof"><span class="ds-label"><span class="ds-label__text">Плановая дата подписания</span></span><div class="rof__row"><span class="rof__value" data-tm-sign>25.01.2027</span></div></div>
        <div class="rof"><span class="ds-label"><span class="ds-label__text">Планируемая дата выдачи</span></span><div class="rof__row"><span class="rof__value" data-tm-issue>15.02.2027</span></div></div>
      </div>
    </div>
  </div>
</section>
