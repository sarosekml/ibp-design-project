<!-- Локальный компонент «Документы» — тайл вкладки «Общая информация» страницы
     клиента (ClientInfoPage). Пара во фронтенде — V2DocumentsInfoTile
     (core/clients-app). Документ — DocCard ДС. Страница вшивает меткой
     <ds-include> и заполняет: LcDocumentsInfoTile.render(host, { documents }). -->
<section class="tile lc-documents-info" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Документы</h3></div>
      <p class="tile__subtitle">Источник: ЭКД</p>
    </div>
  </header>
  <div class="tile__body">
    <div class="alert alert--error alert--m lc-documents-info__error" role="alert">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Не удалось загрузить данные</p>
        <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
    </div>
    <div class="sk-group lc-documents-info__loading" aria-busy="true"><span class="sk-line"></span><span class="sk-line"></span><span class="sk-line"></span></div>
    <div class="lc-documents-info__content">
      <div class="doccard" data-di-card>
        <span class="doccard__icon" aria-hidden="true"><i data-icon="document-check"></i></span>
        <div class="doccard__main">
          <button type="button" class="doccard__title" data-di-name data-tooltip="Бухгалтерская отчётность за 2025 год.pdf" data-tooltip-truncated="only">Бухгалтерская отчётность за 2025 год.pdf</button>
          <span class="doccard__meta" data-di-meta>Загружено: 12.03.2026</span>
        </div>
        <div class="doccard__actions">
          <button type="button" class="btn btn--outline btn--s"><i data-icon="visibility-on"></i><span class="btn__label">Показать содержание</span></button>
          <button type="button" class="btn btn--outline btn--s"><i data-icon="open-wide"></i><span class="btn__label">Открыть</span></button>
        </div>
      </div>
      <a class="link link--accent link--m" href="#" data-inert data-di-more>Еще 2 документа…</a>
      <p class="lc-documents-info__empty" data-di-empty hidden>Документов нет</p>
    </div>
  </div>
</section>
