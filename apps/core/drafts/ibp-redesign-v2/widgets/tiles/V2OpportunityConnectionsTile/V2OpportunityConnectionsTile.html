<!-- Локальный компонент «Связанные сделки» — тайл связей страницы сделки
     (§4.3, «Связанные сделки») и «Связи» страницы лида (§4.6).
     Вшивается меткой ds-include; страница заполняет скриптом
     LcOpportunityConnectionsTile.render(host, {links, emptyText, title}).
     Статическое содержимое — демо-состояние сделки 129451. -->
<section class="tile lc-opp-connections" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Связанные сделки</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="ibtn ibtn--neutral ibtn--m" aria-label="Развернуть связи"><i data-icon="maximize"></i></button>
    </div>
  </header>
  <div class="tile__body" data-connections-body>
    <p class="lc-opp-connections__empty">Нет связанных сделок</p>
  </div>
</section>
