# Сценарии показа прототипа IBP Redesign v1 — часть 1 (MS0014, имена страниц — MS0014a).
# Формат — .agents/proto-panel/README.md, раздел «flows.yaml».
# Сценарии 1–2 из раздела 9 задачи MS0014 (решение Р8); остальные — позже.
# После правки: node .agents/tools/proto-panel.mjs (пересобрать зеркало).
version: 1
lastState: 9
flows:
  - id: analyst-week
    title: Неделя аналитика сегодня
    desc: Базовая линия «как сейчас» для сравнения с MS0015 — сколько разделов открывает аналитик, чтобы охватить одного клиента
    steps:
      - state: 1
        id: home
        title: Главная
        page: HomePage.html
        note: 'Плитки роли «Аналитик ДИД». Дальше по пути: обязательная сделка → Pipeline → проекты CIB → лиды → клиент. Разделов открыто: 1.'
      - state: 2
        id: binding
        title: Обязательные сделки → сделка
        page: BindingActiveNewOpportunities.preview.html?tab=BindingActiveNewOpportunities
        note: 'Непросмотренные строки подсвечены. Переход по ID ведёт на страницу сделки. Разделов открыто: 2.'
        do:
          - click: '#nav .nav__item[href="BindingActiveNewOpportunities.preview.html"]'
      - state: 3
        id: deal
        title: Сделка 166092 — взять в работу
        page: Opportunity.preview.html?source=binding&id=166092&tab=active-new
        note: '«Взять в работу» (Р7): подтверждение → сделка уходит в Pipeline «Сделки моего деска». Разделов открыто: 3.'
      - state: 4
        id: pipeline
        title: Pipeline — сделка появилась
        page: MyDeskOpportunities.preview.html?tab=MyDeskOpportunities
        note: 'Взятая сделка видна в реестре Pipeline. Тот же клиент в CIB — дубль намеренный. Разделов открыто: 4.'
        do:
          - click: '#nav .nav__item[href="MyDeskOpportunities.preview.html"]'
      - state: 5
        id: cib
        title: Проекты продаж CIB — тот же клиент
        page: OpportunityActiveSalesProjects.preview.html?tab=OpportunityActiveSalesProjects
        note: 'Клиент второй раз в другом реестре — боль, с которой работает часть 2. Разделов открыто: 5.'
        do:
          - click: '#nav .nav__item[href="OpportunityActiveSalesProjects.preview.html"]'
      - state: 6
        id: leads
        title: Лиды → лид → Переместить в Pipeline
        page: LeadsPage.preview.html?tab=LeadsPage
        note: 'L-44: «Переместить в Pipeline» (Р7) создаёт сделку в Pipeline; лид уходит из реестра. Разделов открыто: 6.'
        do:
          - click: '#nav .nav__item[href="LeadsPage.preview.html"]'
      - state: 7
        id: client
        title: Клиент → Сделки — четыре таблицы лидов
        page: ClientInfoPage.preview.html?id=3000012345&tab=ClientInfoDealsPage
        note: 'Вкладка «Сделки → Лиды»: лиды клиента разложены по четырём таблицам — то, что часть 2 заменяет единым разделом. Разделов открыто: 7.'
        do:
          - click: '#nav .nav__item[href="MyClientsPage.preview.html"]'

  - id: meeting-born-lead
    title: Встреча родила лид
    desc: Встречи → предпросмотр → источник встречи L-… → лид (сценарий 2 раздела 9 ТЗ)
    steps:
      - state: 8
        id: meetings
        title: Встречи — предпросмотр M-8904
        page: MeetingsProtocolsPage.preview.html?id=M-8904
        note: 'Выбор строки показывает карточку: источник встречи — Потенциал, чип-ссылка L-118846.'
      - state: 9
        id: lead
        title: Лид L-118846
        page: PotentialPage.preview.html?id=L-118846
        note: Переход по источнику открывает страницу лида — встреча и лид связаны.
