<!-- Локальный компонент «Мои клиенты по холдингам» — вид «дерево» реестра
     страницы MyClientsPage. Пара во фронтенде — MyClientsHierarchicalTree
     (core/clients-app). Строки дерева строит скрипт виджета на TableCell ДС.
     Страница вшивает меткой <ds-include> и заполняет:
     LcMyClientsHierarchicalTree.render(host, { onView }). -->
<section class="tile tile--headless lc-my-clients-tree" data-state="data" data-mode="view">
  <div class="alert alert--error alert--m lc-my-clients-tree__error" role="alert">
    <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
    <div class="alert__body"><p class="alert__text">Не удалось загрузить реестр</p>
      <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
  </div>
  <div class="dtable dtable--fill">
    <div class="dtable__toolbar">
      <div class="dtable__toolbar-left"></div>
      <div class="dtable__toolbar-right lc-my-clients-tree__tools">
        <button type="button" class="btn btn--transparent btn--s" data-rt-report><i data-icon="download-report"></i><span class="btn__label">Краткий отчет</span></button>
        <button type="button" class="btn btn--accent btn--s"><i data-icon="add"></i><span class="btn__label">Добавить клиента</span></button>
        <div class="segctrl" role="radiogroup" aria-label="Вид реестра" data-segctrl data-mc-view>
          <div class="segctrl__thumb"></div>
          <button type="button" class="segctrl__item" role="radio" aria-checked="false" tabindex="-1" data-view="rows" aria-label="Таблица"><span class="segctrl__label"><i data-icon="layout-rows-01"></i></span></button>
          <button type="button" class="segctrl__item" role="radio" aria-checked="true" tabindex="0" data-view="tree" aria-label="Дерево холдингов"><span class="segctrl__label"><i data-icon="tree-view"></i></span></button>
        </div>
      </div>
    </div>
    <div class="dtable__body">
      <div class="tbl" data-table data-sort-rows data-mt-tbl><div class="tbl__row tbl__row--head" style="grid-template-columns:8px minmax(8px,1fr)"><div class="th th--separator"></div><div class="th th--separator"></div></div></div>
    </div>
      </div>
</section>
