<!-- Локальный компонент «Реестр проектов продаж CIB» — реестр проектов продаж CIB с вкладками «Активные проекты» и «В архиве» и действиями строки.
     Таблицу рисует общий рендер data/registry-table.js (IBPR_TABLE.opportunities)
     по конфигу реестра «cib» (data/dictionaries.js, REGISTRY_CONFIGS):
     колонки, вкладки-подфильтры, действия строк, разделы фильтра. Страница
     вшивает меткой <ds-include> и монтирует: IBPR_TABLE.opportunities(host).
     Пустое тело — .dtable__empty, ошибка — Alert блока __error. -->
<section class="tile tile--headless lc-cib-opp-table" data-state="data" data-mode="view" data-registry="cib">
  <div class="alert alert--error alert--m lc-cib-opp-table__error" role="alert">
    <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
    <div class="alert__body">
      <p class="alert__text">Не удалось загрузить реестр</p>
      <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div>
    </div>
  </div>
  <div class="dtable dtable--fill">
    <div class="dtable__toolbar">
      <div class="dtable__toolbar-left">
        <div class="tfilter" role="group" aria-label="Фильтр таблицы" data-rt-filter>
          <button class="btn btn--outline btn--s tfilter__open" aria-haspopup="dialog" aria-expanded="false"><i data-icon="filter"></i><span class="btn__label">Фильтр</span></button>
        </div>
      </div>
      <div class="dtable__toolbar-right">
        <button type="button" class="btn btn--transparent btn--s" data-rt-report><i data-icon="download-report"></i><span class="btn__label">Краткий отчет</span></button>
      </div>
    </div>
    <div class="dtable__body">
      <div class="tbl" data-table data-sort-rows data-rt-tbl><div class="tbl__row tbl__row--head" style="grid-template-columns:8px minmax(8px,1fr)"><div class="th th--separator"></div><div class="th th--separator"></div></div></div>
      <div class="dtable__empty" data-rt-empty hidden>
        <span class="illu" data-illu="empty-folder" aria-hidden="true"></span>
        <p class="dtable__empty-title" data-rt-empty-title>Записей нет</p>
      </div>
    </div>
    <div class="dtable__footer" data-rt-footer></div>
  </div>
</section>
