<!-- Локальный компонент «График ФОК» — тайл «Выручка» вкладки «Финансовые
     показатели» страницы клиента (ClientInfoFinancials). Пара во фронтенде —
     FinancialsChart (core/clients-app); части — FinancialChartInfo
     (значение и рост), FinancialChartFilters (период и метрика),
     FinancialsChartLegend (легенда — легенда Chart ДС). График — Chart ДС
     типа combo. Страница вшивает меткой <ds-include> и заполняет:
     LcFinancialsChart.render(host, { fok }). -->
<section class="tile lc-fin-chart" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Выручка</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="btn btn--outline btn--s" aria-haspopup="listbox" aria-expanded="false"><span class="btn__label">Чистый долг/EBITDA</span><i class="btn__chevron" data-icon="chevron-down"></i></button>
      <button type="button" class="btn btn--outline btn--s" aria-haspopup="listbox" aria-expanded="false"><span class="btn__label">36 месяцев</span><i class="btn__chevron" data-icon="chevron-down"></i></button>
    </div>
  </header>
  <div class="tile__body">
    <div class="alert alert--error alert--m lc-fin-chart__error" role="alert">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Не удалось загрузить показатели</p>
        <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
    </div>
    <div class="sk-group lc-fin-chart__loading" aria-busy="true"><span class="sk-line"></span><span class="sk-line"></span><span class="sk-line"></span></div>
    <div class="lc-fin-chart__content">
      <div class="rof"><span class="ds-label"><span class="ds-label__text">Выручка</span></span><div class="rof__row"><span class="rof__value" data-fc-value>346,27 млн RUB</span><span class="badge badge--s badge--success" data-fc-growth>↑ 12.6% гг</span></div></div>
      <div class="lc-fin-chart__plot" data-fc-plot></div>
    </div>
  </div>
</section>
