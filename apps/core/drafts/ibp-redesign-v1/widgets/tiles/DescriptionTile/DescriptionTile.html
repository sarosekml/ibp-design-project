<!-- Локальный компонент «Описание сделки» — тайл страницы сделки (Opportunity).
     Пара во фронтенде — DescriptionTile (pretrade/opportunities-app; у лида
     одноимённый в offersources-app). Страница вшивает меткой <ds-include> и
     заполняет: LcDescriptionTile.render(host, { opportunity }). -->
<section class="tile lc-desc" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Описание сделки</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="ibtn ibtn--neutral ibtn--m" aria-label="Редактировать" data-dt-edit><i data-icon="edit"></i></button>
    </div>
  </header>
  <div class="tile__alert" data-dt-k1 hidden>
    <div class="alert alert--warning alert--m" role="status">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-triangle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Данные К1 в описании сделки не отображены. Для просмотра актуальной информации перейдите в проект продаж</p></div>
    </div>
  </div>
  <div class="tile__body">
    <div class="alert alert--error alert--m lc-desc__error" role="alert">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Не удалось загрузить данные</p>
        <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
    </div>
    <div class="sk-group lc-desc__loading" aria-busy="true"><span class="sk-line"></span><span class="sk-line"></span><span class="sk-line"></span></div>
    <div class="lc-desc__content">
      <p class="lc-desc__text" data-dt-text>Финансирование строительства второй очереди тепличного комплекса: инвестиционный кредит и мезонинное финансирование.</p>
      <div data-dt-empty hidden>
        <button type="button" class="btn btn--outline btn--s"><i data-icon="edit"></i><span class="btn__label">Заполнить</span></button>
      </div>
    </div>
  </div>
</section>
