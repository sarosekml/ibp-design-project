<!-- Локальный компонент «Задачи» — тайл страницы сделки (Opportunity) у
     проектов продаж CIB и кампаний. Пара во фронтенде — TasksTile
     (pretrade/opportunities-app); у лида похожий PotentialTasksTile. Страница
     вшивает меткой <ds-include> и заполняет:
     LcTasksTile.render(host, { tasks }). -->
<section class="tile lc-tasks-tile" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Задачи</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="btn btn--outline btn--xs"><i data-icon="add"></i><span class="btn__label">Добавить</span></button>
    </div>
  </header>
  <div class="tile__body">
    <div class="alert alert--error alert--m lc-tasks-tile__error" role="alert">
      <span class="alert__icon" aria-hidden="true"><i data-icon="alert-circle-filled"></i></span>
      <div class="alert__body"><p class="alert__text">Не удалось загрузить данные</p>
        <div class="alert__buttons"><button type="button" class="btn btn--outline btn--xs btn--error"><span class="btn__label">Повторить</span></button></div></div>
    </div>
    <div class="sk-group lc-tasks-tile__loading" aria-busy="true"><span class="sk-line"></span><span class="sk-line"></span><span class="sk-line"></span></div>
    <div class="lc-tasks-tile__content">
      <ul class="lc-tasks-tile__list" data-tt-list hidden></ul>
      <p class="lc-tasks-tile__empty" data-tt-empty>В сделке нет задач</p>
    </div>
  </div>
</section>
