<!-- Локальный компонент «Дески» — тайл доступа десков страницы сделки
     (§4.3), лида (§4.6) и клиента (§4.8). Вшивается меткой ds-include;
     страница заполняет скриптом LcDesksTile.render(host, {desks, note}).
     Статическое содержимое — демо-состояние сделки 166092. -->
<section class="tile lc-desks" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Дески</h3></div>
    </div>
    <div class="tile__actions">
      <button type="button" class="ibtn ibtn--neutral ibtn--m" aria-label="Редактировать"><i data-icon="edit"></i></button>
    </div>
  </header>
  <div class="tile__body" data-desks-body>
    <p class="lc-desks__note">Сотрудники указанных ниже десков имеют доступ к этой сделке</p>
    <ul class="lc-desks__list">
      <li class="lc-desks__row">
        <span class="lc-desks__name">SMB Природные ресурсы +6</span>
        <span class="chip chip--xs"><span class="chip__label">Ответственный</span></span>
      </li>
      <li class="lc-desks__row">
        <span class="lc-desks__name">ДИД Центральный</span>
        <span class="chip chip--xs"><span class="chip__label">Инициатор</span></span>
      </li>
      <li class="lc-desks__row">
        <span class="lc-desks__name">CIB Москва</span>
        <span class="chip chip--xs"><span class="chip__label">Приглашен</span></span>
      </li>
    </ul>
  </div>
</section>
