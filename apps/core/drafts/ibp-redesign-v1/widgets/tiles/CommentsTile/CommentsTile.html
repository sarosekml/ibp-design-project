<!-- Локальный компонент «Комментарии к стадии» — тайл комментариев страницы
     сделки (§4.3) и страницы лида (§4.6). Вшивается меткой ds-include;
     страница заполняет скриптом LcCommentsTile.render(host, {comments}).
     Статическое содержимое — демо-состояние (комментарий сделки 166092). -->
<section class="tile lc-comments" data-state="data" data-mode="view">
  <header class="tile__header">
    <div class="tile__header-main">
      <div class="tile__title-row"><h3 class="tile__title">Комментарии к стадии</h3></div>
    </div>
    <div class="tile__actions">
      <a class="ibtn ibtn--neutral ibtn--m" aria-label="Показать все комментарии" href="#" data-inert><i data-icon="arrow-right"></i></a>
    </div>
  </header>
  <div class="tile__body lc-comments__list" data-comments-body>
    <div class="lc-comments__item">
      <p class="lc-comments__meta"><span class="lc-comments__author">Соколов Дмитрий Викторович</span> · <span class="lc-comments__time">09:40</span> · <span class="lc-comments__date">06.10.2026</span></p>
      <p class="lc-comments__text">Сделка передана в работу после маршрутизации. Назначить ответственного и согласовать состав команды.</p>
      <div class="lc-comments__acts">
        <button type="button" class="ibtn ibtn--neutral ibtn--s" aria-label="Удалить комментарий"><i data-icon="trash"></i></button>
        <button type="button" class="ibtn ibtn--neutral ibtn--s" aria-label="Править комментарий"><i data-icon="edit"></i></button>
      </div>
    </div>
    <button type="button" class="btn btn--transparent btn--s lc-comments__add"><i data-icon="add"></i><span class="btn__label">Добавить комментарий</span></button>
  </div>
</section>
