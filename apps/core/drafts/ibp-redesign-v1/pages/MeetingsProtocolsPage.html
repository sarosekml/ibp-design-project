<!DOCTYPE html>
<!-- Встречи — страница фронтенда MeetingsProtocolsPage (ib/ma-opportunities-app; модуля встреч стенда в дереве нет).
     Реестр слева, предпросмотр справа — Splitter ДС, как на снимке системы (Встречи.png).
     Источник: открывается собранной MeetingsProtocolsPage.preview.html. -->
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Встречи — IBP Redesign v1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }
  /* раскладка: сплиттер на всю оставшуюся высоту .screen--app; правая
     панель прокручивается своей областью .ds-scroll */
  .split-fill { flex: 1; min-height: 0; }
  .split-fill > .splitpane__a > * { flex: 1; min-width: 0; }
  .split-scroll { flex: 1; min-width: 0; }
</style>
</head>
<body>
<div class="nav-layout">
  <!-- ── Боковое меню: анатомия NavPanel; пункты, имя и роль пользователя
       заполняет data/nav-links.js (IBPR_NAV.mount) из каталога роли ── -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню" data-nav-auto="no">
    <div class="nav__top">
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Развернуть меню"><i data-icon="left-menu"></i></button>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель"><i data-icon="pin-menu"></i></button>
    </div>
    <div class="nav__list" data-nav-list></div>
    <div class="nav__footer">
      <a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">
        <span class="av av--circular av--m"><span class="av__text"></span></span>
        <span class="nav__user-text"><span class="nav__user-name"></span><span class="nav__user-role"></span></span>
      </a>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти"><i data-icon="logout"></i></button>
    </div>
  </nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="HomePage.html">Главная</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Встречи: Мои встречи</span>
      </li>
    </nav>

    <main class="screen__content" data-screen-label="MeetingsProtocolsPage">
      <!-- #sec:head ── Шапка страницы ────────────────────────────────────── -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group"><h1 class="phead__title">Встречи</h1></div>
          </div>
        </div>
        <div class="phead__actions">
          <!-- Р6: формы без источника — по клику ничего -->
          <button type="button" class="btn btn--outline btn--m"><i data-icon="add"></i><span class="btn__label">Новый протокол</span></button>
          <button type="button" class="btn btn--accent btn--m"><i data-icon="add"></i><span class="btn__label">Новая встреча</span></button>
        </div>
      </div>

      <!-- вкладки — подфильтры одной таблицы (Р4) -->
      <div class="tabs tabs--horiz" role="tablist" data-tabs id="reg-tabs">
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="MY"><span class="tab__label">Мои встречи</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="DESK"><span class="tab__label">Встречи моего деска</span></button>
      </div>

      <!-- #sec:content ── реестр и предпросмотр: Splitter ДС -->
      <div class="splitpane split-fill" id="split" data-off-grid="Панели Splitter: ширину задаёт сплиттер">
        <div class="splitpane__panel splitpane__a">
          <ds-include src="../widgets/tables/MeetingsProtocolsList/MeetingsProtocolsList.html" id="mt-list" state="data" mode="view"></ds-include>
        </div>
        <div class="spl" role="separator" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="75" aria-valuenow="55" aria-label="Изменить ширину панелей" tabindex="0">
          <span class="spl__grip"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="splitpane__panel splitpane__b">
          <div class="ds-scroll split-scroll">
            <ds-include src="../widgets/tiles/MeetingsProtocolsDetails/MeetingsProtocolsDetails.html" id="mt-details" state="data" mode="view"></ds-include>
          </div>
        </div>
      </div>

      <!-- #sec:modals ── окна: сборщик выносит в конец страницы -->
      <!-- подтверждение «Завершить» / «Отменить» встречу (Р7) — разметка страницы на Modal ДС -->
      <div class="modal-scrim" id="meeting-confirm-scrim" hidden>
        <div class="modal modal--w3" role="alertdialog" aria-modal="true" aria-labelledby="meeting-confirm-title">
          <header class="modal__head">
            <h2 class="modal__title" id="meeting-confirm-title">Завершить встречу</h2>
            <button type="button" class="ibtn ibtn--neutral ibtn--l" data-modal-close aria-label="Закрыть"><i data-icon="close"></i></button>
          </header>
          <div class="modal__body"><p data-meeting-confirm-text>Встреча получит статус «Завершена».</p></div>
          <footer class="modal__foot"><div class="modal__foot-right">
            <button type="button" class="btn btn--transparent btn--m" data-modal-close><span class="btn__label">Отмена</span></button>
            <button type="button" class="btn btn--accent btn--m" data-meeting-confirm><span class="btn__label">Завершить</span></button>
          </div></footer>
        </div>
      </div>
      <ds-include src="../widgets/modals/ChangeTaskStatusModal/ChangeTaskStatusModal.html"></ds-include>
    </main>
  </div>
</div>

<script src="../../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../data/dictionaries.js"></script>
<script src="../data/employees.js"></script>
<script src="../data/clients.js"></script>
<script src="../data/opportunities.js"></script>
<script src="../data/potentials.js"></script>
<script src="../data/meetings.js"></script>
<script src="../data/tasks.js"></script>
<script src="../data/store.js"></script>
<script src="../data/nav-links.js"></script>
<script src="../data/registry-table.js"></script>
<script src="../widgets/tables/MeetingsProtocolsList/MeetingsProtocolsList.js"></script>
<script src="../widgets/tiles/MeetingsProtocolsDetails/MeetingsProtocolsDetails.js"></script>
<script src="../widgets/modals/ChangeTaskStatusModal/ChangeTaskStatusModal.js"></script>
<script>
/* Экранный скрипт: меню — data/nav-links.js; слева — MeetingsProtocolsList,
   справа — MeetingsProtocolsDetails выбранной встречи (Splitter ДС). */
(function () {
  'use strict';
  window.IBPR_NAV.mount({ active: 'meetings' });
  var S = window.IBPR;
  /* правая панель: выбор строки показывает, крестик прячет; при скрытой
     панели реестр занимает всю ширину (ширину панелей ведёт Splitter ДС) */
  var split = document.getElementById('split');
  var spl = split.querySelector('.spl');
  var paneA = split.querySelector('.splitpane__a');
  var paneB = split.querySelector('.splitpane__b');
  var pct = 55;
  if (window.DSSplitter) window.DSSplitter.wire(spl, { min: 35, max: 75, initial: pct, onChange: function (v) { pct = v; } });
  function showPane(on) {
    paneB.hidden = !on;
    spl.hidden = !on;
    paneA.style.flex = on ? '0 0 ' + pct + '%' : '1 1 auto';
  }
  var details = document.getElementById('mt-details');
  var selected = null;
  var list = window.LcMeetingsProtocolsList.mount(document.getElementById('mt-list'), {
    scope: 'MY',
    onSelect: function (m) { selected = m.id; show(m); }
  });

  var pending = null;
  function show(m) {
    showPane(true);
    window.LcMeetingsProtocolsDetails.render(details, { meeting: m, onAction: onAction });
  }
  function onAction(action, m) {
    if (action === 'close') { showPane(false); list.select(null); return; }
    if (action === 'doTask') {
      window.LcChangeTaskStatusModal.open({ task: m, action: 'done', onConfirm: function () { show(S.meeting(selected)); } });
      return;
    }
    pending = { action: action, id: m.id };
    var finish = action === 'finish';
    document.getElementById('meeting-confirm-title').textContent = finish ? 'Завершить встречу' : 'Отменить встречу';
    document.querySelector('[data-meeting-confirm-text]').textContent = 'Встреча ' + m.id + ' получит статус «' + (finish ? 'Завершена' : 'Отменена') + '».';
    document.querySelector('[data-meeting-confirm] .btn__label').textContent = finish ? 'Завершить' : 'Отменить встречу';
    window.DSModal.open(document.getElementById('meeting-confirm-scrim'));
  }
  document.querySelector('[data-meeting-confirm]').addEventListener('click', function () {
    if (!pending) return;
    if (pending.action === 'finish') S.finishMeeting(pending.id); else S.cancelMeeting(pending.id);
    window.DSModal.closeTop();
    if (window.DSSnack) window.DSSnack.show({ tone: 'success', title: 'Встреча ' + pending.id + (pending.action === 'finish' ? ' завершена' : ' отменена') });
    list.refresh();
    show(S.meeting(pending.id));
  });

  window.IBPR_TABLE.tabs(document.getElementById('reg-tabs'), list, [{ id: 'MY', label: 'Мои встречи' }, { id: 'DESK', label: 'Встречи моего деска' }]);
  /* Явный адрес (?id=M-…) выбирает встречу; без выбора панель скрыта. */
  var want = new URLSearchParams(location.search).get('id');
  var first = want ? S.meeting(want) : null;
  if (first) { selected = first.id; list.select(first.id); show(first); } else showPane(false);
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
