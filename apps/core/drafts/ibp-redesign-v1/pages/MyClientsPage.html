<!DOCTYPE html>
<!-- Клиенты — страница фронтенда MyClientsPage (core/clients-app, pages/MyClients/MyClientsPage).
     Реестр — MyClientsTable, вид «дерево» — MyClientsHierarchicalTree.
     Источник: открывается собранной MyClientsPage.preview.html. -->
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Клиенты — IBP Redesign v1</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }
  /* вид реестра: таблица или дерево — один из двух виджетов; hidden
     сильнее display компонентов ДС */
  .screen__content > [hidden] { display: none; }
</style>
</head>
<body>
<div class="nav-layout">
  <!-- ── Боковое меню: анатомия NavPanel; пункты, имя и роль пользователя
       заполняет data/nav-links.js (IBPR_NAV.mount) из каталога роли ── -->
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню" data-nav-auto="no">
    <div class="nav__top">
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Развернуть меню"><i data-icon="left-menu"></i></button>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель"><i data-icon="pin-menu"></i></button>
    </div>
    <div class="nav__list" data-nav-list></div>
    <div class="nav__footer">
      <a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">
        <span class="av av--circular av--m"><span class="av__text"></span></span>
        <span class="nav__user-text"><span class="nav__user-name"></span><span class="nav__user-role"></span></span>
      </a>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти"><i data-icon="logout"></i></button>
    </div>
  </nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="HomePage.html">Главная</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Клиенты</span>
      </li>
    </nav>

    <main class="screen__content" data-screen-label="MyClientsPage">
      <!-- #sec:head ── Шапка страницы ────────────────────────────────────── -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row"><div class="phead__title-group"><h1 class="phead__title">Клиенты</h1></div></div>
        </div>
      </div>

      <!-- вкладки: «Клиенты моего деска» и «Избранные клиенты» видны, но не
           переключаются (Р3); «Клиенты ДИД» — пустое состояние -->
      <div class="tabs tabs--horiz" role="tablist" data-tabs id="reg-tabs">
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="my" data-page="MyClientsPage"><span class="tab__label">Мои клиенты</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="desk" aria-disabled="true"><span class="tab__label">Клиенты моего деска</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="fav" aria-disabled="true"><span class="tab__label">Избранные клиенты</span></button>
        <button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-tab-id="did"><span class="tab__label">Клиенты ДИД</span></button>
      </div>

      <!-- #sec:content ── реестр: таблица (MyClientsTable) или дерево холдингов
           (MyClientsHierarchicalTree) — выбор в SegmentControl тулбара -->
      <ds-include src="../widgets/tables/MyClientsTable/MyClientsTable.html" id="mc-table" class="col-12" state="data" mode="view"></ds-include>
      <ds-include src="../widgets/tables/MyClientsHierarchicalTree/MyClientsHierarchicalTree.html" id="mc-tree" class="col-12" state="data" mode="view"></ds-include>
    </main>
  </div>
</div>

<script src="../../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../data/dictionaries.js"></script>
<script src="../data/employees.js"></script>
<script src="../data/clients.js"></script>
<script src="../data/opportunities.js"></script>
<script src="../data/potentials.js"></script>
<script src="../data/meetings.js"></script>
<script src="../data/tasks.js"></script>
<script src="../data/store.js"></script>
<script src="../data/nav-links.js"></script>
<script src="../data/registry-table.js"></script>
<script src="../widgets/tables/MyClientsTable/MyClientsTable.js"></script>
<script src="../widgets/tables/MyClientsHierarchicalTree/MyClientsHierarchicalTree.js"></script>
<script>
/* Экранный скрипт: меню — data/nav-links.js; реестр — MyClientsTable на
   общем рендере, вид «дерево» — MyClientsHierarchicalTree. Вкладки «Клиенты
   моего деска» и «Избранные клиенты» не переключаются (Р3). */
(function () {
  'use strict';
  window.IBPR_NAV.mount({ active: 'clients' });
  var tableHost = document.getElementById('mc-table');
  var treeHost = document.getElementById('mc-tree');
  var treeDrawn = false;

  function setView(view) {
    var tree = view === 'tree';
    tableHost.hidden = tree;
    treeHost.hidden = !tree;
    if (tree && !treeDrawn) { window.LcMyClientsHierarchicalTree.render(treeHost, { onView: setView }); treeDrawn = true; }
    window.LcMyClientsTable.setView(tree ? treeHost : tableHost, view);
  }

  var reg = window.LcMyClientsTable.mount(tableHost, { tab: 'my', onView: setView });
  window.IBPR_TABLE.tabs(document.getElementById('reg-tabs'), reg,
    [{ id: 'my', label: 'Мои клиенты', page: 'MyClientsPage' }, { id: 'did', label: 'Клиенты ДИД' }],
    function () { setView('rows'); });
  treeHost.hidden = true;
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
