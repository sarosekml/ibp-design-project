<!DOCTYPE html>
<html lang="ru">
<head>
<script src="../../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спецификация на разработку — IBP</title>
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }

  .screen__content { gap: var(--space-12); }
  /* спека — на всю свободную высоту; прокручивается внутри своей страницы */
  .dsp-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .dsp-view .tile__body { flex: 1; min-height: 0; display: flex; }
  .dsp-frame { flex: 1; min-height: 0; width: 100%; border: 0; }
  /* атрибут hidden не должен проигрывать display компонента */
  .tabs[hidden], .es[hidden], .dsp-view[hidden] { display: none; }
</style>
</head>
<body>
<div class="nav-layout">
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню">
    <div class="nav__top">
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Развернуть меню"><i data-icon="left-menu"></i></button>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель"><i data-icon="pin-menu"></i></button>
    </div>
    <div class="nav__list">
      <a class="nav__item nav__item--selected" href="index.html" aria-current="page"><span class="nav__ico"><i data-icon="file-check"></i></span><span class="nav__label">Спецификации на разработку</span></a>
    </div>
    <div class="nav__footer">
      <a class="nav__user" href="../../../../../index.html" aria-label="Хаб проектов">
        <span class="av av--circular av--m"><span class="av__text">АП</span></span>
        <span class="nav__user-text"><span class="nav__user-name">Александров Пётр</span><span class="nav__user-role">Дизайнер</span></span>
      </a>
      <button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти"><i data-icon="logout"></i></button>
    </div>
  </nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="index.html">Спецификации на разработку</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page" id="dsp-crumb">Спецификация</span>
      </li>
    </nav>

    <main class="screen__content">
      <!-- #sec:head -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group"><h1 class="phead__title" id="dsp-title">Спецификация</h1></div>
          </div>
          <div class="phead__subtitle" id="dsp-meta"></div>
        </div>
        <div class="phead__actions" id="dsp-actions">
          <button type="button" class="btn btn--outline btn--m" data-dsp-get="md"><i data-icon="file"></i><span class="btn__label">Скачать .md</span></button>
          <button type="button" class="btn btn--outline btn--m" data-dsp-get="html"><i data-icon="file"></i><span class="btn__label">Скачать .html</span></button>
          <button type="button" class="btn btn--accent btn--m" data-dsp-get="zip"><i data-icon="download"></i><span class="btn__label">Скачать папку (.zip)</span></button>
        </div>
      </div>

      <!-- #sec:content -->
      <!-- вкладки — только версии (этапы) одной спеки; у спеки в одной версии их нет -->
      <div class="tabs tabs--horiz" role="tablist" aria-label="Версии спецификации" data-tabs id="dsp-tabs" hidden></div>

      <section class="tile tile--headless col-12 dsp-view" id="dsp-view">
        <div class="tile__body">
          <iframe class="dsp-frame" id="dsp-frame" title="Спецификация на разработку" sandbox="allow-scripts"></iframe>
        </div>
      </section>

      <div class="es es--l" id="dsp-empty" hidden>
        <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
        <div class="es__body">
          <p class="es__title">Такой спецификации нет</p>
          <p class="es__text">Список спецификаций — на странице «Спецификации на разработку».</p>
          <a class="btn btn--outline btn--s" href="index.html"><span class="btn__label">К списку</span></a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../data/dev-specs.js"></script>
<script src="../../../../ds-body.js"></script>
<script>
/* Экранный скрипт: одна спека на странице — `Spec.html?spec=<id>` из window.DEV_SPECS (генераты
   dev-spec.mjs). Показывается тот же автономный html, что уйдёт разработчикам (iframe srcdoc);
   вкладки — только версии (этапы) спеки с тем же названием; выгрузка — Blob: .md, .html или
   папка <Spec>/ в zip без сжатия. Работает по file://. */
(function () {
  'use strict';
  var all = window.DEV_SPECS || [];
  var tabs = document.getElementById('dsp-tabs');
  var frame = document.getElementById('dsp-frame');
  var meta = document.getElementById('dsp-meta');
  var current = null;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function ruDate(iso) { var d = new Date(iso); function p(n) { return (n < 10 ? '0' : '') + n; } return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear(); }
  function param(name) { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

  var wanted = param('spec') || location.hash.slice(1);
  var first = all.filter(function (s) { return s.id === wanted; })[0];
  if (!first) {
    document.getElementById('dsp-view').hidden = true;
    document.getElementById('dsp-actions').hidden = true;
    document.getElementById('dsp-empty').hidden = false;
    return;
  }
  /* версии — спеки с тем же названием, по номеру версии */
  var versions = all.filter(function (s) { return s.title === first.title; })
    .sort(function (a, b) { return String(a.version).localeCompare(String(b.version), 'ru', { numeric: true }); });
  document.getElementById('dsp-title').textContent = first.title;
  document.getElementById('dsp-crumb').textContent = first.title;
  document.title = first.title + ' — спецификация на разработку — IBP';

  function show(id) {
    current = versions.filter(function (s) { return s.id === id; })[0] || versions[0];
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (t) {
      var on = t.getAttribute('data-spec') === current.id;
      t.classList.toggle('tab--selected', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.setAttribute('tabindex', on ? '0' : '-1');
    });
    frame.srcdoc = current.html;
    frame.title = 'Спецификация на разработку: ' + current.title + (current.stage ? ' — ' + current.stage : '');
    meta.innerHTML = '<span class="phead__meta">Модуль ' + esc(current.module) + (current.version ? ' · версия ' + esc(current.version) : '') + (current.date ? ' · ' + esc(current.date) : '') + '</span>'
      + '<span class="phead__meta"><span class="phead__meta-ico"><i data-icon="file"></i></span>Снимков ' + current.snaps
      + (current.viewport ? ' · ' + current.viewport.w + '×' + current.viewport.h : '') + (current.taken ? ' · сняты ' + ruDate(current.taken) : '') + '</span>';
    if (window.dsIcons) window.dsIcons.apply(meta);
    try { history.replaceState(null, '', '?spec=' + encodeURIComponent(current.id)); } catch (e) { /* file:// без истории — не важно */ }
  }

  if (versions.length > 1) {
    tabs.hidden = false;
    tabs.innerHTML = versions.map(function (s) {
      return '<button type="button" class="tab tab--m" role="tab" aria-selected="false" tabindex="-1" data-spec="' + esc(s.id) + '"><span class="tab__label">' + esc(s.stage || 'Версия ' + s.version) + '</span></button>';
    }).join('');
    if (window.DSTabs) window.DSTabs.tabs(tabs, { onChange: function (t) { show(t.getAttribute('data-spec')); } });
    tabs.addEventListener('click', function (e) { var t = e.target.closest('.tab'); if (t) show(t.getAttribute('data-spec')); });
  }
  show(first.id);

  /* ---------- выгрузка ---------- */
  function save(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  var CRC = (function () { var t = [], c, n, k; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  /* zip без сжатия: [{ name, text }] → Blob */
  function zip(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0, d = new Date();
    var time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    function header(size) { var b = new ArrayBuffer(size); return { buf: b, v: new DataView(b) }; }
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      var h = header(30), v = h.v;
      v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true); v.setUint16(8, 0, true);
      v.setUint16(10, time, true); v.setUint16(12, date, true); v.setUint32(14, crc, true);
      v.setUint32(18, data.length, true); v.setUint32(22, data.length, true); v.setUint16(26, name.length, true); v.setUint16(28, 0, true);
      parts.push(h.buf, name, data);
      var c = header(46), w = c.v;
      w.setUint32(0, 0x02014b50, true); w.setUint16(4, 20, true); w.setUint16(6, 20, true); w.setUint16(8, 0x0800, true); w.setUint16(10, 0, true);
      w.setUint16(12, time, true); w.setUint16(14, date, true); w.setUint32(16, crc, true);
      w.setUint32(20, data.length, true); w.setUint32(24, data.length, true); w.setUint16(28, name.length, true);
      w.setUint32(42, offset, true);
      central.push(c.buf, name);
      offset += 30 + name.length + data.length;
    });
    var size = central.reduce(function (s, p) { return s + p.byteLength; }, 0);
    var e = header(22), x = e.v;
    x.setUint32(0, 0x06054b50, true); x.setUint16(8, files.length, true); x.setUint16(10, files.length, true);
    x.setUint32(12, size, true); x.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [e.buf]), { type: 'application/zip' });
  }

  document.getElementById('dsp-actions').addEventListener('click', function (e) {
    var b = e.target.closest('[data-dsp-get]');
    if (!b || !current) return;
    var kind = b.getAttribute('data-dsp-get'), id = current.id;
    if (kind === 'md') save(new Blob([current.md], { type: 'text/markdown;charset=utf-8' }), id + '.md');
    else if (kind === 'html') save(new Blob([current.html], { type: 'text/html;charset=utf-8' }), id + '.html');
    else save(zip([{ name: id + '/' + id + '.md', text: current.md }, { name: id + '/' + id + '.html', text: current.html }]), id + '.zip');
  });
})();
</script>
</body>
</html>
