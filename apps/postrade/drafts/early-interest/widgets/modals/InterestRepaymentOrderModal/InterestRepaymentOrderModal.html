<!-- Связанный артефакт тайла «Порядок погашения»: окно с порядком погашения процентной
     задолженности инструмента. Все типы задолженности списком Entity; приоритет 1 — сверху,
     гасится первым. Порядок меняется стрелками «выше» / «ниже» в строке.

     Ось data-mode на .modal — права: edit (стрелки, «Отменить» + «Сохранить») | view (только
     список и «Закрыть»). Строки и режим ставит InterestRepaymentOrderModal.js
     (PostModalRepaymentOrder); строки в разметке — демо.

     Фрагмент вшивается ассемблером отдельной меткой ds-include в конце страницы. -->

<div class="modal-scrim" id="repay-order-scrim" hidden>
  <div class="modal modal--w4 lc-repay-order-modal" data-mode="edit" role="dialog" aria-modal="true" aria-labelledby="repay-order-title">
    <header class="modal__head">
      <h2 class="modal__title" id="repay-order-title">Порядок погашения</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__body">
      <p class="note note--s">
        <span class="note__icon" aria-hidden="true"><i data-icon="info-circle"></i></span>
        <span class="note__text">Досрочный платёж гасит задолженность сверху вниз: сначала тип с приоритетом 1, остаток — следующий по порядку. Порядок один на весь инструмент.</span>
      </p>
      <div class="entity-list" data-repay-list>
        <div class="entity" data-code="CAPITALIZED">
          <div class="entity__main"><div class="entity__titles"><p class="entity__header">Приоритет 1</p><div class="entity__labelrow"><span class="entity__label">Капитализированная задолженность</span></div></div></div>
          <div class="entity__actions">
            <button type="button" class="ibtn ibtn--neutral ibtn--s" data-move="up" aria-label="Выше: Капитализированная задолженность" disabled><i data-icon="arrow-narrow-up"></i></button>
            <button type="button" class="ibtn ibtn--neutral ibtn--s" data-move="down" aria-label="Ниже: Капитализированная задолженность"><i data-icon="arrow-narrow-down"></i></button>
          </div>
        </div>
      </div>
    </div>

    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--transparent btn--m lc-repay-order-modal__edit" data-modal-close><span class="btn__label">Отменить</span></button>
        <button type="button" class="btn btn--accent btn--m lc-repay-order-modal__edit" data-repay-save><span class="btn__label">Сохранить</span></button>
        <button type="button" class="btn btn--accent btn--m lc-repay-order-modal__view" data-modal-close><span class="btn__label">Закрыть</span></button>
      </div>
    </footer>
  </div>
</div>
