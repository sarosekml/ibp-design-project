<!-- Окно «Данные FV» — предпросмотр загруженного файла FV. Фрагмент вшивается
     ассемблером меткой ds-include — скрим должен лежать в конце body.

     Тело окна — таблица предпросмотра (до 100 первых строк). Строки в
     разметке нет: страница рисует их из window.MOCK_FV_UPLOAD_PREVIEW в
     контейнер [data-fv-preview-rows] при открытии. «Сохранить» закрывает окно. -->

<div class="modal-scrim" id="reserves-fv-scrim" hidden>
  <div class="modal modal--w6" role="dialog" aria-modal="true" aria-labelledby="reserves-fv-title">
    <header class="modal__head">
      <h2 class="modal__title" id="reserves-fv-title">Данные FV</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__alert">
      <div class="alert alert--info alert--m alert--flush" data-alert-tone="info" role="status" aria-live="polite">
        <span class="alert__icon" aria-hidden="true"><i data-icon="Info-circle-filled"></i></span>
        <div class="alert__body">
          <p class="alert__text">Для предпросмотра загруженных данных доступно не более 100 первых строк</p>
        </div>
      </div>
    </div>

    <div class="modal__body modal__body--flush">
      <div class="dtable">
        <div class="dtable__body">
          <div class="tbl tbl--scroll" data-table data-fv-preview-rows>
            <div class="tbl__row tbl__row--head" style="grid-template-columns:8px 64px 140px minmax(240px,1fr) 200px 8px;">
              <div class="th th--separator"></div>
              <div class="th"><span class="th__label">№</span></div>
              <div class="th"><span class="th__label">Дата</span></div>
              <div class="th"><span class="th__label">Финансовый инструмент</span></div>
              <div class="th th--right"><span class="th__label">FV, вал. ед.</span></div>
              <div class="th th--separator"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-modal-close><span class="btn__label">Сохранить</span></button>
      </div>
    </footer>
  </div>
</div>
