<!-- NavigatorChangeReasonModal — окно причины ввода изменений. Артефакт тайла
     «Заведение сделки» (Navigator): открывается пунктом кебаба «Ввести
     изменения» у активной сделки. Фрагмент вшивается отдельной меткой
     ds-include: скрим лежит в конце body.

     Окно есть у фронтенда (features/modals/NavigatorChangeReasonModal), на
     макетах его нет. Здесь — оболочка: заголовок, многострочное поле «Причина»
     и «Сохранить» (задача RE0013, раздел 4). Заголовок — как у остальных окон
     навигатора; состав не согласован (допущение 10.10.2026, вопрос 1
     паспорта). Крестик и Esc — без перехода. -->
<div class="modal-scrim" id="nav-change-reason-scrim" hidden>
  <div class="modal modal--w3" role="dialog" aria-modal="true" aria-labelledby="nav-change-reason-title">
    <header class="modal__head">
      <h2 class="modal__title" id="nav-change-reason-title">Подтвердите действие</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <!-- InputText ДС, многострочный: textarea растёт по высоте сам -->
      <div class="inp inp--m inp--fullwidth inp--multiline">
        <label class="ds-label" for="nav-change-reason-text"><span class="ds-label__text">Причина</span></label>
        <div class="inp__field">
          <textarea class="inp__control" id="nav-change-reason-text" name="changeReason" rows="4"></textarea>
        </div>
      </div>
    </div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-nav-change-reason-save disabled><span class="btn__label">Сохранить</span></button>
      </div>
    </footer>
  </div>
</div>
