<!-- NavigatorDealCloseModal — окно погашения сделки. Артефакт тайла «Заведение
     сделки» (Navigator): открывается пунктом кебаба «Погасить» у активной
     сделки. Фрагмент вшивается отдельной меткой ds-include: скрим лежит в
     конце body.

     Макета окна нет. Из пояснения screenflow известно одно поле — дата
     погашения («встаёт в „Сроки сделки“»). Остальное собрано по образцу окна
     погашения инструмента (RepaymentModal): заголовок, строка «Погашение сделки
     N. Имя», InputDate «Дата погашения» — по умолчанию сегодня, «Подтвердить»
     (допущение 10.10.2026, вопрос 1 паспорта). Крестик и Esc — без перехода.

     Текст и дату ставит NavigatorDealCloseModal.js; ниже — пример. -->
<div class="modal-scrim" id="nav-deal-close-scrim" hidden>
  <div class="modal modal--w3 lc-nav-deal-close" role="dialog" aria-modal="true" aria-labelledby="nav-deal-close-title" aria-describedby="nav-deal-close-text">
    <header class="modal__head">
      <h2 class="modal__title" id="nav-deal-close-title">Подтвердите действие</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>
    <div class="modal__body">
      <p class="lc-nav-deal-close__text" id="nav-deal-close-text">Погашение сделки 1024. Финансирование строительства логистического хаба</p>
      <!-- InputDate ДС: маска и календарь — из коробки; крестик очистки рисует
           рантайм поля по значению, после заполнения кодом окно зовёт
           DSInput.syncAll -->
      <div class="inp inp--m inp--fullwidth">
        <label class="ds-label" for="nav-deal-close-date"><span class="ds-label__text">Дата погашения</span></label>
        <div class="inp__field">
          <input class="inp__control" id="nav-deal-close-date" name="repayDate" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" autocomplete="off" value="10.10.2026">
          <span class="inp__acts">
            <button type="button" class="inp__act" aria-label="Открыть календарь" aria-haspopup="dialog"><i data-icon="calendar"></i></button>
          </span>
        </div>
      </div>
    </div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--accent btn--m" data-nav-deal-close-save><span class="btn__label">Подтвердить</span></button>
      </div>
    </footer>
  </div>
</div>
