<!-- Подчасть окна «Документы по сделке» (CounterpartiesEcmModal): документы
     выбранного участника сделки — второй шаг. Лежит в папке окна-владельца,
     как у фронтенда (CounterpartiesEcmModal/EcmModal); паспорт общий с
     владельцем, стили — его же (CounterpartiesEcmModal.css). Вшивается своей
     меткой рядом с ним — у фрагмента один корневой элемент, и сборщик не
     раскрывает метки внутри фрагмента.

     Вид — по макету дизайнера «Документы по сделке»:
     в теле полное наименование контрагента, под ним документы. В продукте
     документы открываются из внешней системы хранения; в прототипе её нет,
     поэтому на их месте — пустое состояние с объяснением.

     Подвал (решение человека 25.09.2026): слева «К списку контрагентов» со
     стрелкой — шаг назад к выбору, справа аутлайновая «Закрыть».
     Открывает и возвращает к списку CounterpartiesEcmModal.js; наименование
     ниже — пример. -->

<div class="modal-scrim" id="deal-ecm-docs-scrim" hidden>
  <div class="modal modal--w8" role="dialog" aria-modal="true" aria-labelledby="deal-ecm-docs-title">
    <header class="modal__head">
      <h2 class="modal__title" id="deal-ecm-docs-title">Документы по сделке</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть" data-modal-close><i data-icon="close"></i></button>
    </header>

    <div class="modal__body">
      <p class="lc-deal-ecm__heading" data-ecm-party-name>КГ Самолёт</p>
      <div class="es es--m">
        <span class="illu es__illu" data-illu="empty-folder" aria-hidden="true"></span>
        <div class="es__body">
          <p class="es__title">Просмотр документов</p>
          <p class="es__text">Здесь открываются документы выбранного участника сделки. В прототипе просмотра документов нет.</p>
        </div>
      </div>
    </div>

    <!-- Шаг назад — слева, как вторичное действие формы; закрытие — справа.
         «Закрыть» аутлайновая: подтверждать в окне нечего, залитая обещала бы
         действие, которого нет. -->
    <footer class="modal__foot">
      <div class="modal__foot-left">
        <button type="button" class="btn btn--transparent btn--m" data-ecm-back><i data-icon="arrow-left"></i><span class="btn__label">К списку контрагентов</span></button>
      </div>
      <div class="modal__foot-right">
        <button type="button" class="btn btn--outline btn--m" data-modal-close><span class="btn__label">Закрыть</span></button>
      </div>
    </footer>
  </div>
</div>
