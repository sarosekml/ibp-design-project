<!DOCTYPE html>
<!--
  Двойным кликом открывают НЕ этот файл, а собранный RsbuInterestAdjustments.preview.html:
  окно внесения корректировки стоит здесь меткой <ds-include>, а рантайм-инклуд ДС тянет
  фрагмент через fetch, который по file:// не работает. Собрать: node .agents/tools/assemble.mjs
-->
<html lang="ru">
<head>
<script src="../../../ds-config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корректировки процентов РСБУ — IBP</title>
<style>
  /* ---------- только раскладка экрана, на токенах ДС ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { margin: 0; font-family: var(--font-text), system-ui, sans-serif; color: var(--text-primary); background: var(--bg-page); }

  .screen__content { gap: var(--space-16); }
</style>
</head>
<body>

<div class="nav-layout">
  <nav class="nav nav--rail" id="nav" aria-label="Главное меню"></nav>

  <div class="screen screen--app">
    <nav class="crumbs" aria-label="Хлебные крошки" data-breadcrumbs>
      <li class="crumbs__item"><a class="link link--muted" href="MainPage.html">Главная</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Текущий портфель ДИД</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Сделка</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="#">Договор</a></li>
      <li class="crumbs__item"><a class="link link--muted" href="Tranche.html">Транш</a></li>
      <li class="crumbs__item crumbs__item--current">
        <span class="crumbs__current" aria-current="page">Корректировки процентов РСБУ</span>
      </li>
    </nav>

    <main class="screen__content">

      <!-- #sec:head ── Шапка страницы -->
      <div class="phead">
        <div class="phead__main">
          <div class="phead__title-row">
            <div class="phead__title-group"><h1 class="phead__title">Корректировки процентов РСБУ</h1></div>
            <span class="phead__return">
              <a class="btn btn--outline btn--xs" href="Tranche.html" id="rh-return">
                <i data-icon="flip-backward"></i><span class="btn__label">В транш</span></a>
            </span>
          </div>
        </div>
        <div class="phead__actions">
          <button type="button" class="btn btn--accent btn--m" id="rh-add"><i data-icon="add"></i><span class="btn__label">Внести корректировку</span></button>
        </div>
      </div>

      <!-- #sec:content ── Таблица корректировок -->
      <div class="dtable dtable--fill">
        <div class="dtable__body">
          <div class="tbl" data-table data-sort-rows id="rh-tbl">
              <div class="tbl__row tbl__row--head" style="grid-template-columns:8px 64px 280px 280px 200px 400px 128px minmax(8px,1fr);">
                <div class="th th--separator"></div>
                <div class="th" data-col="num"><span class="th__label">№</span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th" data-col="startDate"><span class="th__label">Исходная дата</span><span class="th__tools"><button type="button" class="ibtn ibtn--neutral ibtn--s th__sort" data-sort="startDate" aria-label="Сортировать: Исходная дата"><i data-icon="arrow-up-down"></i></button></span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th" data-col="endDate"><span class="th__label">Целевая дата</span><span class="th__tools"><button type="button" class="ibtn ibtn--neutral ibtn--s th__sort" data-sort="endDate" aria-label="Сортировать: Целевая дата"><i data-icon="arrow-up-down"></i></button></span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th th--right" data-col="adjustmentAmount"><span class="th__label">Сумма корректировки</span><span class="th__tools"><button type="button" class="ibtn ibtn--neutral ibtn--s th__sort" data-sort="adjustmentAmount" aria-label="Сортировать: Сумма корректировки"><i data-icon="arrow-up-down"></i></button></span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th" data-col="comment"><span class="th__label">Комментарий</span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th" data-col="actions"><span class="th__label">Действия</span><span class="th__resize" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Изменить ширину колонки"></span></div>
                <div class="th th--separator"></div>
              </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- #sec:modals ── «Новая корректировка» / «Редактирование корректировки»: одна форма — виджет -->
<ds-include src="../widgets/modals/RsbuAdjustmentModal/RsbuAdjustmentModal.html"></ds-include>

<!-- Подтверждение удаления корректировки -->
<div class="modal-scrim" id="rh-delete-scrim" hidden>
  <div class="modal modal--w3" role="alertdialog" aria-modal="true" aria-labelledby="rh-delete-title">
    <header class="modal__head">
      <h2 class="modal__title" id="rh-delete-title">Удалить корректировку</h2>
      <button type="button" class="ibtn ibtn--neutral ibtn--l" aria-label="Закрыть"><i data-icon="close"></i></button>
    </header>
    <div class="modal__body"><p id="rh-delete-text" style="margin:0;"></p></div>
    <footer class="modal__foot">
      <div class="modal__foot-right">
        <button type="button" class="btn btn--transparent btn--m" data-modal-close><span class="btn__label">Отменить</span></button>
        <button type="button" class="btn btn--accent btn--m btn--danger" id="rh-delete-confirm"><span class="btn__label">Удалить</span></button>
      </div>
    </footer>
  </div>
</div>

<script src="../../../ds-body.js" data-ds="patterns/HomeRoles/ibp-home.js"></script>
<script src="../data/mock-deals.js"></script>
<script src="../data/deal-status-model.js"></script>
<script src="../data/deals-store.js"></script>
<script src="../data/post-api.js"></script>
<script src="../data/mock-product-catalog.js"></script>
<script src="../data/mock-fin-instruments.js"></script>
<script src="../data/mock-deal-trees.js"></script>
<script src="../data/product-tree-store.js"></script>
<script src="../data/tranche-context.js"></script>
<script src="../data/tranche-data.js"></script>
<script src="../widgets/modals/RsbuAdjustmentModal/RsbuAdjustmentModal.js"></script>
<script>
/* Экранный скрипт: меню по каталогу ролей, таблица корректировок РСБУ и модалка добавления/правки.
   Форматирование — только при выводе: суммы «1 000 000,00» (можно со знаком «-»), даты ДД.ММ.ГГГГ.
   Данные живут в памяти страницы: после перезагрузки таблица возвращается к состоянию из адреса. */
(function () {
  'use strict';
  var role = window.IBPHome.defaultRole;
  var SELECTED_ID = 'current-portfolio';
  var USER_LINK_FROM = ' href="#" aria-label="Открыть личный кабинет"';
  var USER_LINK_TO = ' href="../../../../index.html" aria-label="Хаб проектов"';
  var NBSP = ' ';

  function ic(name) { return '<i data-icon="' + name + '"></i>'; }

  function itemHTML(it) {
    var sel = (it.id === SELECTED_ID) ? ' nav__item--selected" aria-current="page' : '';
    return '<a class="nav__item' + sel + '" href="#"><span class="nav__ico">' + ic(it.icon) + '</span>'
      + '<span class="nav__label">' + it.label + '</span></a>';
  }

  function buildNav() {
    var nav = document.getElementById('nav');
    var s = '<div class="nav__top">'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__burger" aria-label="Свернуть меню">' + ic('left-menu') + '</button>'
      + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__pin" aria-pressed="false" aria-label="Закрепить панель">' + ic('pin-menu') + '</button>'
      + '</div><div class="nav__list">'
      + '<a class="nav__item" href="MainPage.html"><span class="nav__ico">' + ic('main-page') + '</span><span class="nav__label">Главная</span></a>';
    IBPHome.itemsFor(role).forEach(function (g, i) {
      s += '<div class="nav__block' + (i === 0 ? ' nav__block--first' : '') + '"><div class="nav__block-label">' + g.label + '</div>';
      g.items.forEach(function (it) { s += itemHTML(it); });
      s += '</div>';
    });
    s += '</div>' + (window.IBPHome && window.IBPHome.footerHTML
      ? window.IBPHome.footerHTML(role).replace(USER_LINK_FROM, USER_LINK_TO)
      : '<div class="nav__footer">'
        + '<a class="nav__user" href="../../../../index.html" aria-label="Хаб проектов">'
        + '<span class="av av--circular av--m"><span class="av__text">АП</span></span>'
        + '<span class="nav__user-text"><span class="nav__user-name">Александров Пётр</span>'
        + '<span class="nav__user-role">' + role + '</span></span></a>'
        + '<button type="button" class="ibtn ibtn--neutral ibtn--m nav__logout" aria-label="Выйти">' + ic('logout') + '</button>'
        + '</div>');
    nav.innerHTML = s;
    if (window.DSNavPanel) window.DSNavPanel.bind(nav);
  }
  /* ---------- формат ---------- */
  function money(n) {
    var p = Number(n).toFixed(2).split('.');
    return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + ',' + p[1];
  }
  function date(iso) { var p = String(iso).split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* ---------- данные ---------- */
  var data = window.MOCK_RSBU_ADJUSTMENTS;
  /* Состояния для панели прототипа: ?demo=filled — корректировки уже внесены (как в тайле «Внесено корректировок»);
     ?demo=edit — открыта правка первой строки; ?demo=delete — открыто подтверждение удаления.
     Без demo таблица пуста. */
  function demoHas(name) { var m = /[?&]demo=([a-z,]+)/.exec(location.search); return !!m && m[1].split(',').indexOf(name) >= 0; }
  var rows = (demoHas('filled') || demoHas('delete') || demoHas('edit')) ? data.adjustments.map(function (r) { return Object.assign({}, r); }) : [];

  var GRID = '8px 64px 280px 280px 200px 400px 128px minmax(8px,1fr)';
  var tbl = document.getElementById('rh-tbl');

  function cell(key, text, num, sortValue) {
    return '<div class="tc' + (num ? ' tc--numbers' : '') + '" data-col="' + key + '"' + (sortValue != null ? ' data-sort-value="' + sortValue + '"' : '') + '>'
      + '<span class="tc__row"><span class="tc__text tc__text--truncate">' + esc(text) + '</span></span></div>';
  }
  var ROW_ACTIONS = '<div class="tc" data-col="actions"><span class="tc__controls">'
    + '<button type="button" class="ibtn ibtn--neutral ibtn--s" data-edit aria-label="Редактировать корректировку"><i data-icon="edit"></i></button>'
    + '<button type="button" class="ibtn ibtn--neutral ibtn--s" data-delete aria-label="Удалить корректировку"><i data-icon="trash"></i></button>'
    + '</span></div>';

  function rowHTML(r, i) {
    return '<div class="tbl__row" data-idx="' + i + '" style="grid-template-columns:' + GRID + ';"><div class="tc tc--separator"></div>'
      + cell('num', String(i + 1), true)
      + cell('startDate', date(r.startDate), false, r.startDate)
      + cell('endDate', date(r.endDate), false, r.endDate)
      + cell('adjustmentAmount', money(r.adjustmentAmount), true, r.adjustmentAmount)
      + cell('comment', r.comment || '—', false)
      + ROW_ACTIONS + '<div class="tc tc--separator"></div></div>';
  }

  /* шапка — в разметке; перерисовываются только строки данных */
  function render() {
    tbl.querySelectorAll('.tbl__row:not(.tbl__row--head)').forEach(function (r) { r.remove(); });
    tbl.insertAdjacentHTML('beforeend', rows.map(rowHTML).join(''));
    if (window.dsIcons) window.dsIcons.apply(tbl);
    if (window.DSTable) {
      window.DSTable.wireAll(tbl.parentNode);
      var api = window.DSTable.wire(tbl);
      if (api && api.rowsChanged) api.rowsChanged();
    }
  }

  /* ---------- уведомления: фоновый тост ДС, зелёный, уходит сам ---------- */
  function toast(message) {
    if (window.DSToast) window.DSToast.show({ message: message, kind: 'bar', tone: 'success' });
  }

  /* ---------- окно корректировки: виджет RsbuAdjustmentModal ----------
     Форму, проверку и тексты ошибок ведёт окно; страница даёт ему список дат и валюту
     и принимает проверенную запись. */
  var editIdx = -1;   // индекс строки в rows; -1 — новая корректировка
  var modal = window.PostModalRsbuAdjustment.bind(document.getElementById('rsbu-adj-scrim'), {
    options: function () { return { currencyCode: data.currencyCode, startDateOptions: data.startDateOptions }; },
    save: function (rec, wasEdit) {
      if (wasEdit) rows[editIdx] = rec; else rows.push(rec);
      render();
      toast(wasEdit ? 'Корректировка изменена' : 'Корректировка добавлена');
    }
  });
  function openModal(idx) {
    editIdx = idx;
    modal.open(idx >= 0 ? rows[idx] : null);
  }

  document.getElementById('rh-add').addEventListener('click', function () { openModal(-1); });

  /* ---------- удаление с подтверждением ---------- */
  var deleteIdx = -1;
  function openDelete(idx) {
    if (idx < 0) return;
    deleteIdx = idx;
    var r = rows[idx];
    document.getElementById('rh-delete-text').textContent = 'Удалить корректировку с ' + date(r.startDate) + ' по ' + date(r.endDate) + '? Действие нельзя отменить.';
    if (window.DSModal) window.DSModal.open(document.getElementById('rh-delete-scrim'));
  }
  document.getElementById('rh-delete-confirm').addEventListener('click', function () {
    var had = deleteIdx >= 0;
    if (had) rows.splice(deleteIdx, 1);
    deleteIdx = -1;
    render();
    if (window.DSModal) window.DSModal.closeTop();
    if (had) toast('Корректировка удалена');
  });

  /* индекс строки в rows — по data-idx (после сортировки порядок в DOM другой) */
  function idxOfRow(row) { return row ? parseInt(row.getAttribute('data-idx'), 10) : -1; }
  tbl.addEventListener('dblclick', function (e) {
    var row = e.target.closest('.tbl__row:not(.tbl__row--head)');
    if (row) openModal(idxOfRow(row));
  });
  tbl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-edit]');
    if (b) { openModal(idxOfRow(b.closest('.tbl__row'))); return; }
    var d = e.target.closest('[data-delete]');
    if (d) openDelete(idxOfRow(d.closest('.tbl__row')));
  });

  /* ---------- крошки и возврат: сделка, договор и транш из дерева продуктов ----------
     Адрес ?id=<сделка>&tr=<транш> идёт обратно на транш и в крошки
     (Tranche.html?id=<сделка>&tr=<транш>); названия — как на странице транша
     (TrancheContext). Дерево читается после ProductTreeStore.ready. */
  function fill() {
    var ctx = window.TrancheContext.resolve(location.search);
    if (!ctx) return;
    var preview = /\.preview\.html$/.test(location.pathname);
    var dealHref = (preview ? 'Deal.preview.html' : 'Deal.html') + ctx.dealQuery;
    var tranche = (preview ? 'Tranche.preview.html' : 'Tranche.html') + ctx.trancheQuery;
    window.TrancheContext.paintCrumbs(document.querySelector('[data-breadcrumbs]'), [
      null,
      { href: 'Portfolio.html' },
      { text: ctx.dealLabel, href: dealHref },
      { text: ctx.parentLabel, href: dealHref },
      { text: ctx.trancheLabel, href: tranche }
    ]);
    document.getElementById('rh-return').setAttribute('href', tranche);
  }

  buildNav(); render();
  window.ProductTreeStore.ready.then(fill);
  /* ?open=add — страница открыта кнопкой «Внести корректировку» с тайла: модалка поднята сразу */
  if (/[?&]open=add/.test(location.search)) openModal(-1);
  if (demoHas('edit')) openModal(0);
  if (demoHas('delete')) openDelete(rows.length - 1);
  if (window.dsIcons) window.dsIcons.apply(document);
})();
</script>
</body>
</html>
